name: Build Bugsby APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias bugsby \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bugsby123 \
            -keypass bugsby123 \
            -dname "CN=Bugsby, OU=Companion, O=Bugsby, L=Android, S=Global, C=US"

      - name: Build Signed Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Deliverables
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -ls
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Bugsby.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/Bugsby-debug.apk
          fi
          ls -lh dist/

      - name: Verify APK Signatures
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Using apksigner from $BUILD_TOOLS_DIR"
          if [ -f dist/Bugsby.apk ]; then
            $BUILD_TOOLS_DIR/apksigner verify --verbose dist/Bugsby.apk || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugsby-APKs
          path: dist/*.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.1
          name: Bugsby v1.0.1 (Signed APK)
          draft: false
          prerelease: false
          body: |
            ## 🥷 Bugsby AI Companion - v1.0.1 Signed Release

            Fully signed APK for installation on Android devices.

            ### 📦 Download:
            - **Primary (Recommended)**: `Bugsby.apk` (Signed Release Build)
            - **Debug build**: `Bugsby-debug.apk`

            ### 📲 Installation Troubleshooting:
            If tapping **Install** does nothing or closes the dialog:
            1. **Install via Files App**: Do not tap directly inside the browser's download shelf. Instead, open your phone's **Files** or **My Files** app, navigate to **Downloads**, and tap `Bugsby.apk` there.
            2. **Allow Unknown Apps**: In your phone Settings -> Apps -> Special app access -> Install unknown apps, make sure your Files app / Browser has permission enabled.
            3. Tap **Install** and enjoy Bugsby!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
