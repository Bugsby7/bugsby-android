name: Build Bugsby APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias bugsby \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bugsby123 \
            -keypass bugsby123 \
            -dname "CN=Bugsby, OU=Companion, O=Bugsby, L=Android, S=Global, C=US"

      - name: Build Signed Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Bugsby.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Bugsby-debug.apk
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugsby-APKs
          path: dist/*.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.1
          name: Bugsby v1.0.1 (Signed Release APK)
          draft: false
          prerelease: false
          body: |
            ## 🥷 Bugsby AI Companion - v1.0.1 Signed Release

            Fully signed APK (with both v1 JAR signature and v2 full-APK signature) for installation on all Android devices.

            ### 📦 Download:
            - **Primary (Recommended)**: `Bugsby.apk` (Signed Release Build)
            - **Debug alternative**: `Bugsby-debug.apk`

            ### ⚠️ Important Note If Package Installer Closes on Tap:
            1. **Stop Screen Recording**: If you are recording your screen (or have a floating recorder button active), Android's tapjacking protection (`filterTouchesWhenObscured`) intentionally blocks or dismisses the "Install" button to prevent screen capture tapjacking. **Pause or stop screen recording before tapping Install.**
            2. **Turn off screen dimmers / blue-light filters**: Night shift or screen tint apps overlaying the display will trigger the same security block.
            3. Tap `Bugsby.apk`, tap **Install**, and launch your ninja companion!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
