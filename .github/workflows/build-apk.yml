name: Build Bugsby APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias bugsby \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bugsby123 \
            -keypass bugsby123 \
            -dname "CN=Bugsby, OU=Companion, O=Bugsby, L=Android, S=Global, C=US"

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Deliverables
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Bugsby.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Bugsby-debug.apk
          ls -lh dist/

      - name: Force Full Dual v1 + v2 Signing with apksigner
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Using apksigner from $BUILD_TOOLS_DIR"
          
          # Re-sign release APK to guarantee v1 JAR + v2 APK signature schemes
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks app/release.keystore \
            --ks-key-alias bugsby \
            --ks-pass pass:bugsby123 \
            --key-pass pass:bugsby123 \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            dist/Bugsby.apk

          echo "=== Verifying Bugsby.apk Signatures ==="
          $BUILD_TOOLS_DIR/apksigner verify --verbose dist/Bugsby.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugsby-APKs
          path: dist/*.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.2
          name: Bugsby v1.0.2 (Dual v1+v2 Signed APK)
          draft: false
          prerelease: false
          body: |
            ## 🥷 Bugsby AI Companion - v1.0.2 Release

            Dual-signed APK (v1 JAR signature + v2 APK Signature Scheme) verified with Android `apksigner`.

            ### 📦 Download Links:
            - **Primary Recommended**: `Bugsby.apk` (Signed Release Build)
            - **Debug alternative**: `Bugsby-debug.apk`

            ### 📲 How to Install:
            1. Download `Bugsby.apk`.
            2. Open your phone's **Files** or **File Manager** app -> open **Downloads** folder -> tap `Bugsby.apk`.
            3. Tap **Install** and launch Bugsby!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
